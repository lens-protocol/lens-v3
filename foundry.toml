[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
cache_path  = 'cache_forge'
solc_version = '0.8.28'
# via_ir = true
optimizer = false
# optimizer_runs = 10
fs_permissions = [{ access = "read", path = "./test/token-uri/expected-svgs/"}, { access = "read", path = "./addressBook.json"}]
allow_internal_expect_revert = true
evm_version = 'paris'
# Ignore the following warnings:
#
# - [5740] Unreachable code:
#   It is triggered by code that is actually reachable because of inheritance. Unlikely to happen in production.
#
# - [5574] Size limit:
#   zkSync's zkEVM has a bigger size limit than classic EVM, and we sometimes use classic foundry for quicker
#   compilation during development. Also, tests will trigger this warning otherwise too.
ignored_error_codes = [5740, 5574] 

[profile.default.fuzz]
runs = 1024
no_zksync_reserved_addresses = true

[profile.default.zksync]
# Compile contracts for zkVM
# compile = true
# Enable zkVM at startup, needs `compile = true` to have effect
# startup = true
# # By default the latest version is used
zksolc = "1.5.12"
# # By default the corresponding solc patched version from matter-labs is used
# solc_path = "./solc-0.8.23-1.0.1"
bytecode_hash = "none"
# # Allow compiler to use mode 'z' if contracts won't fit in the EraVM bytecode
# # size limitations
# fallback_oz = false
# # Enable EraVM extensions (ex system-mode)
# enable_eravm_extensions = false
# # Force compilation via EVMLA instead of Yul codegen pipeline
# force_evmla = false
# # Enable optimizer on zksolc (defaults to true)
optimizer = true
# zksolc optimizer mode (0 | 1 | 2 | 3 | s | z)
optimizer_mode = '1'
# # zksolc optimizer details
# optimizer_details = { ... }
codegen = 'yul'

[fmt]
line_length = 121
